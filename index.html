<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namiza - Rekomendasi Shopee Affiliate</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f7f7f7;
            color: #333;
            padding-bottom: 50px;
        }

        /* Header Toko Namiza */
        header {
            background: linear-gradient(135deg, #ee4d2d, #ff7337);
            color: white;
            text-align: center;
            padding: 30px 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* Search Bar */
        .search-box {
            width: 100%;
            padding: 14px 20px;
            margin-bottom: 25px;
            border: 2px solid #ee4d2d;
            border-radius: 30px;
            font-size: 1rem;
            outline: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Kategori Title */
        .category-title {
            font-size: 1.2rem;
            margin: 25px 0 15px;
            color: #ee4d2d;
            border-left: 4px solid #ee4d2d;
            padding-left: 10px;
        }

        /* Grid Produk */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        /* Card Produk */
        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
        }

        .img-container {
            width: 100%;
            height: 160px;
            background-color: #eee;
            overflow: hidden;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .product-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: #444;
        }

        .btn-shopee {
            display: block;
            background-color: #ee4d2d;
            color: white;
            text-align: center;
            text-decoration: none;
            padding: 8px 0;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        @media (min-width: 600px) {
            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
                gap: 20px;
            }
            .img-container {
                height: 190px;
            }
        }
    </style>
</head>
<body>

    <!-- Header Namiza -->
    <header>
        <h1>NAMIZA</h1>
        <p>Spesialis Rekomendasi Produk Terbaik & Promo Shopee</p>
    </header>

    <div class="container">
        <!-- Pencarian -->
        <input type="text" id="searchInput" class="search-box" placeholder="Cari produk di Namiza..." onkeyup="searchProduct()">

        <!-- KATEGORI 1 -->
        <h2 class="category-title">✨ Fashion & Outfit</h2>
        <div class="product-grid">
            
            <!-- Produk 1 -->
            <div class="product-card">
                <div class="img-container">
                    <!-- CARA AMAN: Pakai Link Gambar Langsung dari Internet/Shopee -->
                    <img src="https://down-id.img.susercontent.com/file/id-11134207-7r98o-lx28z0qj093282" 
                         onerror="this.src='https://via.placeholder.com/200?text=Gambar+Error'" 
                         alt="Kemeja Premium" class="product-img">
                </div>
                <div class="product-info">
                    <div class="product-title">Kemeja Oversize Premium Namiza</div>
                    <a href="https://s.shopee.co.id/LINK_AFFILIATE_1" target="_blank" class="btn-shopee">Cek di Shopee</a>
                </div>
            </div>

            <!-- Produk 2 -->
            <div class="product-card">
                <div class="img-container">
                    <img src="https://via.placeholder.com/200" 
                         onerror="this.src='https://via.placeholder.com/200?text=Gambar+Error'" 
                         alt="Sepatu Casual" class="product-img">
                </div>
                <div class="product-info">
                    <div class="product-title">Sepatu Sneakers White Casual</div>
                    <a href="https://s.shopee.co.id/LINK_AFFILIATE_2" target="_blank" class="btn-shopee">Cek di Shopee</a>
                </div>
            </div>

        </div>

        <!-- KATEGORI 2 -->
        <h2 class="category-title">💄 Kecantikan & Skincare</h2>
        <div class="product-grid">
            
            <!-- Produk 3 -->
            <div class="product-card">
                <div class="img-container">
                    <img src="https://via.placeholder.com/200" 
                         onerror="this.src='https://via.placeholder.com/200?text=Gambar+Error'" 
                         alt="Sunscreen" class="product-img">
                </div>
                <div class="product-info">
                    <div class="product-title">Sunscreen SPF 50 PA++++ Soft Texture</div>
                    <a href="https://s.shopee.co.id/LINK_AFFILIATE_3" target="_blank" class="btn-shopee">Cek di Shopee</a>
                </div>
            </div>

        </div>
    </div>

    <script>
        function searchProduct() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('product-card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].querySelector('.product-title').innerText.toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
